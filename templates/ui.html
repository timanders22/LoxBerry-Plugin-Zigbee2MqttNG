{% import 'macros.html' as m %}
<style>
    #page_content {
        margin: 0px !important;
    }

    /* 4.2.0: a view of the Devices tab - the house container is 980 px
       wide, the zigbee2mqtt UI keeps the full width it had as a page */
    .sm-wrap {
        max-width: none;
    }
</style>
{% if service.frontendAuth and service.frontendToken %}
{{ m.legende(['technik']) }}
<p class="hint">{{ 'Devices.UIToken' | trans }} {{ m.geheim('uitoken', service.frontendToken) }}</p>
{% endif %}
<iframe id="zngui" scrolling="yes" seamless="seamless" style="width:100%; height:85vh;" frameborder="0"></iframe>
<script>
    document.getElementById("zngui").src = window.location.protocol + "//" + window.location.hostname + ":{{ port }}";
</script>
