; Hilfetexte zu templates/help/help.html. LBWeb::gethelp() leitet den Namen
; dieser Datei aus dem Namen der Hilfevorlage ab und sucht sie in
; templates/lang/. Die Werte werden nicht maskiert, Auszeichnung bleibt.

[HELP]
TITLE="Zigbee2MqttNG"
INTRO="Das Plugin betreibt zigbee2mqtt als Dienst. zigbee2mqtt spricht über einen Koordinator (USB-Stick oder Netzwerkadapter) mit den Zigbee-Geräten und veröffentlicht jedes Gerät am MQTT-Broker. Das LoxBerry MQTT-Gateway leitet die Werte an den Miniserver weiter."
TABS_TITLE="Reiter"
TABS_TEXT="Über den Reitern steht eine Statusübersicht: Dienst, Koordinator, erreichbare Geräte, MQTT. <b>Einstellungen</b>: Adapter, Funkkanal, Oberfläche, Benachrichtigungen, Dienst starten/anhalten, Einstellungen sichern und zurückspielen, Sicherung des Zigbee-Netzes. <b>Geräte</b>: Anlernen, Geräteliste, Netzwerkkarte, Zigbee2mqtt UI, devices.yaml. <b>MQTT</b>: Broker und Weiterleitung an den Miniserver, Haus-Themen. <b>Einbindung in Loxone</b>: sieben Schritte mit Vorlagen für virtuelle Ein- und Ausgänge, Ausfallerkennung und den Baustein-Listen zweier Seiten aus dem Musterprojekt (Ausfall; Taster, Steckdose, Fensterkontakt, Lampe), je mit Bauanleitung und Bild. <b>Test</b>: prüft die ganze Kette ohne Loxone. <b>Logdateien</b>."
SETUP_TITLE="Erste Schritte"
SETUP_ADAPTER="Adapter-Pfad: bei einem USB-Stick das Gerät, am besten der feste Name unter /dev/serial/by-id/…; bei einem Netzwerkadapter tcp://IP-Adresse:Port (z. B. SONOFF Dongle-M: tcp://192.168.1.50:6638). Die IP-Adresse ist verlässlicher als ein .local-Name. Die Koordinator-Vorlage füllt die Felder."
SETUP_TYPE="Adapter-Typ: ember für Chips von Silicon Labs (z. B. SONOFF Dongle-E, Dongle-M/Max), zstack für Chips von Texas Instruments (z. B. SONOFF Dongle-P). Baudrate und Flusssteuerung nur, wenn der Hersteller sie vorgibt."
SETUP_MQTT="MQTT: „Verwende MQTT Gateway Anmeldedaten“ und „Topic beim MQTT Gateway registrieren“ einschalten, dann leitet das Gateway die Werte ohne weitere Einrichtung weiter."
SETUP_SAVE="„Speichern und aktualisieren“ schreibt die configuration.yaml und startet den Dienst neu. Ob alles trägt, zeigt der Reiter Test."
PAIR_TITLE="Geräte anlernen"
PAIR_TEXT="Im Reiter Geräte „Für 254 s öffnen“ drücken (zigbee2mqtt 2.x kennt kein dauerhaftes Anlernen mehr). Dann das Gerät in den Anlernmodus bringen, meist den Knopf etwa fünf Sekunden halten, bis es blinkt. Beim Anlernen das Gerät nah an den Koordinator oder einen Router halten."
NAMES_TITLE="Gerätenamen"
NAMES_TEXT="Ein neues Gerät heißt nach seiner IEEE-Adresse. Einen lesbaren Namen vergeben (devices.yaml im Reiter Geräte oder in der Zigbee2mqtt UI). Der Name wird Teil des MQTT-Themas und der Eingangsnamen in Loxone - späteres Umbenennen bedeutet neue Eingänge in Loxone. Leerzeichen sind erlaubt; die Vorlagen für Ausgänge senden JSON-Befehle, die damit umgehen können."
LOXONE_TITLE="Werte in Loxone"
LOXONE_TEXT="Mit dem MQTT-Gateway kommt jeder Wert an einem Virtuellen Eingang namens &lt;Topic&gt;_&lt;Gerät&gt;_&lt;Wert&gt; an (/, Leerzeichen und % werden _), z. B. zigbee2mqtt_Kueche_temperature. Zusätzlich: &lt;Gerät&gt;_erreichbar (1/0) und je Tasteraktion &lt;Gerät&gt;_aktion_&lt;Aktion&gt; als Impuls. Mit Fassung 2 die Datenpunkte nach der Hakenliste im Reiter Einbindung in Loxone anhaken (JSON-Felder, bei Tastern Reset). Befehle: publish &lt;Topic&gt;/&lt;Gerät&gt;/set/&lt;Eigenschaft&gt; &lt;Wert&gt; an den UDP-Eingang des Gateways."
PLUGINS_TITLE="Zusammenspiel mit anderen Plugins"
PLUGINS_TEXT="Mit Matter2Lox teilt sich das Plugin die Hausvereinbarung haus/tuer/&lt;name&gt;/offen|verriegelt (gelesen von Funkwacht und Beschattungswächter) und den Namen erreichbar. Zigbee und Thread nutzen dieselben Funkkanäle - die Einstellungen zeigen beide. Der Reiter Test warnt, wenn ein anderer Prozess den Adapter offen hat oder Matter2Lox dieselben Türnamen vergibt."
LOGS_TITLE="Logdateien"
LOGS_TEXT="zigbee2mqtt.log steht unter Logdateien. Die Plugin-Protokolle liegen auf einer RAM-Disk und überstehen keinen Neustart des LoxBerry; wer eine Meldung braucht, kopiert sie vorher heraus."
LINK_DEVICES="unterstützte Geräte"
LINK_ADAPTERS="Adapter"
HAUS_TITLE="Haus-Themen für andere Plugins"
HAUS_TEXT="Reiter MQTT, je Familie ein Haken, ab Werk aus: <b>haus/tuer</b> (Kontakte, Schlösser), <b>haus/klima</b> (Raumklima), <b>haus/wetter</b> (nur als „außen“ markierte Fühler), <b>haus/alarm</b> (Rauch, Wasser, Gas, CO). VOC kommt unverändert in der Einheit des Geräts, die Einheit steht im Namen: <code>voc_ugm3</code> (µg/m³) oder <code>voc_ppb</code> (ppb) – keine Umrechnung, sie hängt vom Gasgemisch ab; VOC ohne oder mit anderer Einheit liefert kein Feld. Je Gerät ein fester Name, nur die Felder, die das Gerät liefert, Werte retained mit <code>zeit</code> (liegt die letzte Meldung über eine Stunde zurück, gehen die Werte ohne Aussage hinaus: temperatur -999, sonst -1, tuer -), dazu <code>&lt;name&gt;/anbieter</code> und das Lebenszeichen <code>haus/&lt;familie&gt;/zaehler/zigbee2mqttng</code> (nicht retained). Beim Ausschalten, beim Abwählen eines Geräts und bei der Deinstallation räumt das Plugin seine Themen am Broker ab und liest zurück, ob sie wirklich weg sind; fremde Themen fasst es nie an."
MELD_TITLE="Meldungen per Signal und Sprache"
MELD_TEXT="Reiter Einstellungen, Abschnitt Meldungen: je Anlass (nicht erreichbar, Batterie, Alarm, Firmware-Update) LoxBerry-Benachrichtigung, Signal und Sprache. Signal braucht im SignalBot „Befehle über MQTT annehmen“ und die Freigabe für zigbee2mqttng; die Quittung steht im Protokoll und im Reiter Test. Sprache spricht nicht in der Ruhezeit – ein Alarm spricht immer. Höchstens 10 Signal-Meldungen und 10 Ansagen je Stunde."
FW_TITLE="Firmware-Anzeige"
FW_TEXT="Reiter Geräte, Spalte Firmware: aktuell, Update verfügbar, wird eingespielt, kein OTA oder noch keine Aussage. Eingespielt wird in der Zigbee2MQTT-Oberfläche – das Plugin startet kein Update. Für Loxone: <code>&lt;Topic&gt;/zigbee2mqttng/updates</code> (Zahl der Geräte mit Update) und je OTA-Gerät <code>…/update_verfuegbar</code>, beide im MQTT-Gateway V2 anhaken."
KANAL_TITLE="Kanalwahl"
KANAL_TEXT="Unter dem Feld Kanal steht, ob der heutige Zigbee-Kanal zu WLAN und Thread passt, sonst welche der Kanäle 15, 20 und 25 günstiger wären. Ein Kanalwechsel heißt, alle Geräte neu anzulernen – deshalb gibt es nur den Hinweis, keinen Knopf."
UPDATE_TITLE="Nach einem Update"
UPDATE_TEXT="Ein Dienst, der vor dem Update lief, läuft danach wieder; ein angehaltener bleibt angehalten (ein Neustart des LoxBerry startet ihn trotzdem, wie bisher). Konnte das Update Einstellungen und Netzdaten nicht zurückkopieren, bleibt die Sicherung unter /tmp liegen und zigbee2mqtt gesperrt, bis die Sperre im Reiter Einstellungen aufgehoben wird."
