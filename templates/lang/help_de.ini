; dieser Datei aus dem Namen der Hilfevorlage ab und sucht sie in
; templates/lang/. Die Werte werden nicht maskiert, Auszeichnung bleibt.

[HELP]
TITLE="Zigbee2MqttNG"
INTRO="Das Plugin betreibt zigbee2mqtt als Dienst. zigbee2mqtt spricht über einen Koordinator (USB-Stick oder Netzwerkadapter) mit den Zigbee-Geräten und veröffentlicht jedes Gerät am MQTT-Broker. Das LoxBerry MQTT-Gateway leitet die Werte an den Miniserver weiter."
TABS_TITLE="Reiter"
TABS_TEXT="Über den Reitern steht eine Statusübersicht: Dienst, Koordinator, erreichbare Geräte, MQTT. <b>Einstellungen</b>: Adapter, Funkkanal, Oberfläche, Benachrichtigungen, Dienst starten/anhalten, Einstellungen sichern und zurückspielen, Sicherung des Zigbee-Netzes. <b>Geräte</b>: Anlernen, Geräteliste, Netzwerkkarte, Zigbee2mqtt UI, devices.yaml. <b>MQTT</b>: Broker und Weiterleitung an den Miniserver, Haus-Themen. <b>Einbindung in Loxone</b>: sieben Schritte mit Vorlagen für virtuelle Ein- und Ausgänge, Ausfallerkennung und Baustein-Liste. <b>Test</b>: prüft die ganze Kette ohne Loxone. <b>Logdateien</b>."
SETUP_TITLE="Erste Schritte"
SETUP_ADAPTER="Adapter-Pfad: bei einem USB-Stick das Gerät, am besten der feste Name unter /dev/serial/by-id/…; bei einem Netzwerkadapter tcp://IP-Adresse:Port (z. B. SONOFF Dongle-M: tcp://192.168.1.50:6638). Die IP-Adresse ist verlässlicher als ein .local-Name. Die Koordinator-Vorlage füllt die Felder."
SETUP_TYPE="Adapter-Typ: ember für Chips von Silicon Labs (z. B. SONOFF Dongle-E, Dongle-M/Max), zstack für Chips von Texas Instruments (z. B. SONOFF Dongle-P). Baudrate und Flusssteuerung nur, wenn der Hersteller sie vorgibt."
SETUP_MQTT="MQTT: „Verwende MQTT Gateway Anmeldedaten“ und „Topic beim MQTT Gateway registrieren“ einschalten, dann leitet das Gateway die Werte ohne weitere Einrichtung weiter."
SETUP_SAVE="„Speichern und aktualisieren“ schreibt die configuration.yaml und startet den Dienst neu. Ob alles trägt, zeigt der Reiter Test."
PAIR_TITLE="Geräte anlernen"
PAIR_TEXT="Im Reiter Geräte „Für 254 s öffnen“ drücken (zigbee2mqtt 2.x kennt kein dauerhaftes Anlernen mehr). Dann das Gerät in den Anlernmodus bringen, meist den Knopf etwa fünf Sekunden halten, bis es blinkt. Beim Anlernen das Gerät nah an den Koordinator oder einen Router halten."
NAMES_TITLE="Gerätenamen"
NAMES_TEXT="Ein neues Gerät heißt nach seiner IEEE-Adresse. Einen lesbaren Namen vergeben (devices.yaml im Reiter Geräte oder in der Zigbee2mqtt UI). Der Name wird Teil des MQTT-Themas und der Eingangsnamen in Loxone - späteres Umbenennen bedeutet neue Eingänge in Loxone. Leerzeichen sind erlaubt; die Vorlagen für Ausgänge senden JSON-Befehle, die damit umgehen können."
LOXONE_TITLE="Werte in Loxone"
LOXONE_TEXT="Mit dem MQTT-Gateway in Fassung 1 kommt jeder Wert an einem virtuellen Eingang namens &lt;Topic&gt;_&lt;Gerät&gt;_&lt;Wert&gt; an, z. B. zigbee2mqtt_Kueche_temperature. Zusätzlich: &lt;Gerät&gt;_erreichbar (1/0) und je Tasteraktion &lt;Gerät&gt;_aktion_&lt;Aktion&gt; als Impuls. Mit Fassung 2 die Datenpunkte auf der Abonnement-Seite des Gateways anhaken. Batteriegeräte melden meist nur bei Änderung oder alle paar Minuten. Ob zigbee2mqtt selbst noch lebt, sagt das Lebenszeichen &lt;Topic&gt;_zigbee2mqttng_zaehler: es zählt jede Minute eins weiter und ist nie retained."
PLUGINS_TITLE="Zusammenspiel mit anderen Plugins"
PLUGINS_TEXT="Mit Matter2Lox teilt sich das Plugin die Hausvereinbarung haus/tuer/&lt;name&gt;/offen|verriegelt (gelesen von Funkwacht und Beschattungswächter) und den Namen erreichbar. Zigbee und Thread nutzen dieselben Funkkanäle - die Einstellungen zeigen beide. Der Reiter Test warnt, wenn ein anderer Prozess den Adapter offen hat oder Matter2Lox dieselben Türnamen vergibt."
LOGS_TITLE="Logdateien"
LOGS_TEXT="zigbee2mqtt.log steht unter Logdateien. Die Plugin-Protokolle liegen auf einer RAM-Disk und überstehen keinen Neustart des LoxBerry; wer eine Meldung braucht, kopiert sie vorher heraus."
LINK_DEVICES="unterstützte Geräte"
LINK_ADAPTERS="Adapter"
