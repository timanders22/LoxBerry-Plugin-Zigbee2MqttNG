; of this file from the name of the help template and looks for it in
; templates/lang/. Values are not escaped, markup stays as it is.

[HELP]
TITLE="Zigbee2MqttNG"
INTRO="The plugin runs zigbee2mqtt as a service. zigbee2mqtt talks to the Zigbee devices through a coordinator (USB stick or network adapter) and publishes every device on the MQTT broker. The LoxBerry MQTT gateway forwards the values to the Miniserver."
TABS_TITLE="Tabs"
TABS_TEXT="<b>Settings</b>: adapter, radio channel, UI, notifications, start/stop the service, back up and restore the settings, backup of the Zigbee network. <b>Devices</b>: pairing, device list, network map, Zigbee2mqtt UI, devices.yaml. <b>MQTT</b>: broker and forwarding to the Miniserver, house topics. <b>Loxone integration</b>: seven steps with templates for virtual inputs and outputs, failure detection and block list. <b>Test</b>: checks the whole chain without Loxone. <b>Logs</b>."
SETUP_TITLE="First steps"
SETUP_ADAPTER="Adapter path: for a USB stick the device, preferably the stable name under /dev/serial/by-id/...; for a network adapter tcp://IP-address:port (e.g. SONOFF Dongle-M: tcp://192.168.1.50:6638). Prefer the IP address to a .local name. The coordinator preset fills the fields."
SETUP_TYPE="Adapter type: ember for Silicon Labs chips (e.g. SONOFF Dongle-E, Dongle-M/Max), zstack for Texas Instruments chips (e.g. SONOFF Dongle-P). Baudrate and flow control only if the vendor asks for it."
SETUP_MQTT="MQTT: enable “Use MQTT Gateway credentials” and “Register topics on the MQTT Gateway”, then the gateway forwards the values without further setup."
SETUP_SAVE="“Save and apply” writes configuration.yaml and restarts the service. The Test tab shows whether everything works."
PAIR_TITLE="Pairing devices"
PAIR_TEXT="Press “Open for 254 s” on the Devices tab (zigbee2mqtt 2.x has no permanent pairing any more). Then put the device into pairing mode, usually by holding its button for about five seconds until it blinks. Keep the device close to the coordinator or a router while pairing."
NAMES_TITLE="Device names"
NAMES_TEXT="A new device is called by its IEEE address. Give it a readable name (devices.yaml on the Devices tab or in the Zigbee2mqtt UI). The name becomes part of the MQTT topic and of the input names in Loxone - renaming later means new inputs in Loxone. Spaces are fine; the output templates send JSON commands that cope with them."
LOXONE_TITLE="Values in Loxone"
LOXONE_TEXT="With the MQTT gateway in version 1, each value arrives at a virtual input named &lt;topic&gt;_&lt;device&gt;_&lt;value&gt;, e.g. zigbee2mqtt_Kitchen_temperature. In addition: &lt;device&gt;_erreichbar (1/0) and per button action &lt;device&gt;_aktion_&lt;action&gt; as a pulse. With version 2, tick the data points on the gateway's subscription page. Battery devices usually report only on change or every few minutes. Whether zigbee2mqtt itself is still alive tells the heartbeat &lt;Topic&gt;_zigbee2mqttng_zaehler: it counts up every minute and is never retained."
PLUGINS_TITLE="Working with other plugins"
PLUGINS_TEXT="With Matter2Lox the plugin shares the house convention haus/tuer/&lt;name&gt;/offen|verriegelt (read by Funkwacht and Beschattungswächter) and the name erreichbar. Zigbee and Thread use the same radio channels - the settings show both. The Test tab warns when another process has the adapter open or Matter2Lox gives the same door names."
LOGS_TITLE="Logs"
LOGS_TEXT="zigbee2mqtt.log is listed under Logs. The plugin logs are kept on a RAM disk and do not survive a restart of the LoxBerry; copy a message out before restarting if you need it."
LINK_DEVICES="supported devices"
