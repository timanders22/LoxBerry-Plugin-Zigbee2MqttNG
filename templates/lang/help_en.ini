; Help texts for templates/help/help.html. LBWeb::gethelp() derives the name
; of this file from the name of the help template and looks for it in
; templates/lang/. Values are not escaped, markup stays as it is.

[HELP]
TITLE="Zigbee2MqttNG"
INTRO="The plugin runs zigbee2mqtt as a service. zigbee2mqtt talks to the Zigbee devices through a coordinator (USB stick or network adapter) and publishes every device on the MQTT broker. The LoxBerry MQTT gateway forwards the values to the Miniserver."
TABS_TITLE="Tabs"
TABS_TEXT="Above the tabs a status overview shows the service, the coordinator, the reachable devices and MQTT. <b>Settings</b>: adapter, radio channel, UI, notifications, start/stop the service, back up and restore the settings, backup of the Zigbee network. <b>Devices</b>: pairing, device list, network map, Zigbee2mqtt UI, devices.yaml. <b>MQTT</b>: broker and forwarding to the Miniserver, house topics. <b>Loxone integration</b>: seven steps with templates for virtual inputs and outputs, failure detection and the block lists of two pages from the sample project (failure; button, plug, window contact, lamp), each with building instructions and a picture. <b>Test</b>: checks the whole chain without Loxone. <b>Log files</b>."
SETUP_TITLE="First steps"
SETUP_ADAPTER="Adapter path: for a USB stick the device, preferably the stable name under /dev/serial/by-id/...; for a network adapter tcp://IP-address:port (e.g. SONOFF Dongle-M: tcp://192.168.1.50:6638). Prefer the IP address to a .local name. The coordinator preset fills the fields."
SETUP_TYPE="Adapter type: ember for Silicon Labs chips (e.g. SONOFF Dongle-E, Dongle-M/Max), zstack for Texas Instruments chips (e.g. SONOFF Dongle-P). Baudrate and flow control only if the vendor asks for it."
SETUP_MQTT="MQTT: enable “Use MQTT Gateway credentials” and “Register topics on the MQTT Gateway”, then the gateway forwards the values without further setup."
SETUP_SAVE="“Save and apply” writes configuration.yaml and restarts the service. The Test tab shows whether everything works."
PAIR_TITLE="Pairing devices"
PAIR_TEXT="Press “Open for 254 s” on the Devices tab (zigbee2mqtt 2.x has no permanent pairing any more). Then put the device into pairing mode, usually by holding its button for about five seconds until it blinks. Keep the device close to the coordinator or a router while pairing."
NAMES_TITLE="Device names"
NAMES_TEXT="A new device is called by its IEEE address. Give it a readable name (devices.yaml on the Devices tab or in the Zigbee2mqtt UI). The name becomes part of the MQTT topic and of the input names in Loxone - renaming later means new inputs in Loxone. Spaces are fine; the output templates send JSON commands that cope with them."
LOXONE_TITLE="Values in Loxone"
LOXONE_TEXT="With the MQTT gateway every value arrives at a Virtual Input called &lt;topic&gt;_&lt;device&gt;_&lt;value&gt; (/, spaces and % become _), e.g. zigbee2mqtt_Kueche_temperature. In addition: &lt;device&gt;_erreichbar (1/0) and per button action &lt;device&gt;_aktion_&lt;action&gt; as a pulse. With version 2 tick the data points according to the tick list on the tab Loxone integration (JSON fields, Reset for buttons). Commands: publish &lt;topic&gt;/&lt;device&gt;/set/&lt;property&gt; &lt;value&gt; to the UDP input of the gateway."
PLUGINS_TITLE="Working with other plugins"
PLUGINS_TEXT="With Matter2Lox the plugin shares the house convention haus/tuer/&lt;name&gt;/offen|verriegelt (read by Funkwacht and Beschattungswächter) and the name erreichbar. Zigbee and Thread use the same radio channels - the settings show both. The Test tab warns when another process has the adapter open or Matter2Lox gives the same door names."
LOGS_TITLE="Logs"
LOGS_TEXT="zigbee2mqtt.log is listed under Logs. The plugin logs are kept on a RAM disk and do not survive a restart of the LoxBerry; copy a message out before restarting if you need it."
LINK_DEVICES="supported devices"
LINK_ADAPTERS="adapters"
HAUS_TITLE="House topics for other plugins"
HAUS_TEXT="MQTT tab, one switch per family, off by default: <b>haus/tuer</b> (contacts, locks), <b>haus/klima</b> (indoor climate), <b>haus/wetter</b> (only sensors marked outdoor), <b>haus/alarm</b> (smoke, water, gas, CO). VOC comes unchanged in the unit of the device, the unit is in the name: <code>voc_ugm3</code> (µg/m³) or <code>voc_ppb</code> (ppb) – no conversion, it depends on the gas mixture; VOC without or with another unit delivers no field. One fixed name per device, only the fields the device delivers, values retained with <code>zeit</code> (if the last message is older than one hour, the values go out without statement: temperatur -999, otherwise -1, tuer -), plus <code>&lt;name&gt;/anbieter</code> and the heartbeat <code>haus/&lt;familie&gt;/zaehler/zigbee2mqttng</code> (not retained). When switching off, deselecting a device and on uninstall the plugin removes its topics at the broker and reads back whether they are really gone; it never touches foreign topics."
MELD_TITLE="Notifications through Signal and speech"
MELD_TEXT="Settings tab, section Notifications: per occasion (not reachable, battery, alarm, firmware update) LoxBerry notification, Signal and speech. Signal needs accept commands via MQTT in SignalBot and the release for zigbee2mqttng; the answer is in the log and on the Test tab. Speech does not speak in the quiet time – an alarm always speaks. At most 10 Signal messages and 10 announcements per hour."
FW_TITLE="Firmware display"
FW_TEXT="Devices tab, column Firmware: up to date, update available, being installed, no OTA or no statement yet. Updates are installed in the Zigbee2MQTT interface – the plugin starts no update. For Loxone: <code>&lt;Topic&gt;/zigbee2mqttng/updates</code> (number of devices with an update) and per OTA device <code>…/update_verfuegbar</code>, tick both in the MQTT gateway V2."
KANAL_TITLE="Channel choice"
KANAL_TEXT="Below the field channel it says whether today's Zigbee channel fits WLAN and Thread, otherwise which of the channels 15, 20 and 25 would be better. Changing the channel means pairing every device again – so there is only the hint, no button."
UPDATE_TITLE="After an update"
UPDATE_TEXT="A service that ran before the update runs again afterwards; a stopped one stays stopped (a reboot of the LoxBerry starts it anyway, as before). If the update could not copy back settings and network data, the backup stays in /tmp and zigbee2mqtt stays blocked until the block is lifted on the Settings tab."
