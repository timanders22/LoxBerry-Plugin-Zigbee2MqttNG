SCHRITTE_TITEL="So übernehmen Sie diese Seite"
S1_TITEL="Zigbee2MqttNG"
S2_TITEL="Zigbee2MqttNG Geräte"
S1_ZWECK="Läuft zigbee2mqtt, sind die Geräte da? Diese Seite braucht jeder: sie meldet, wenn zigbee2mqtt schweigt oder ein Gerät nicht erreichbar ist, und zeigt den Zustand in Klartext. Sie genügt für den Anfang."
S1_SCHRITT1="Im Plugin Reiter „Einstellungen“: „Erreichbarkeit melden“ an (ab Werk an). Reiter „Test“: die Zeile „Kommt das Lebenszeichen für Loxone?“ ist grün. Im MQTT-Gateway die Umwandlung true/false/ON/OFF in 1/0 einschalten (Schritt 1 dieses Reiters zeigt, ob sie an ist)."
S1_SCHRITT2="In Loxone Config unter Peripherie → Virtuelle Eingänge je Wert der Liste einen Virtuellen Eingang anlegen (Nr. 1, 3, 9, 12, 13, 14), Titel genau wie in der Spalte Name – im eigenen Projekt mit den eigenen Gerätenamen aus der Namenstabelle in Schritt 3. Unter Gateway V2 vorher die Datenpunkte anhaken (Schritt 2, bei Temperatur, Feuchte und Batterie als JSON-Felder)."
S1_SCHRITT3="Seite „Zigbee2MqttNG“ anlegen. Den Zähler (…_zigbee2mqttng_zaehler), erreichbar von zwei Geräten sowie Temperatur, Feuchte und Batterie eines Sensors ziehen, dazu die Konstante 1. Im eigenen Projekt stehen dort die eigenen Gerätenamen."
S1_SCHRITT4="Benachrichtigung „Meldung Zigbee gestört“ anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Liste, und auf die Seite ziehen. Sie bekommt genau eine Leitung (von Nr. 6)."
S1_SCHRITT5="Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, nach der Spalte „Eingänge verbinden mit“ von oben nach unten verbinden. Analogwertvalidierung Nr. 2: En = Konstante 1, und den Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; mit Haken kommt die 1 als 0 an und die Meldung löst nie aus). Status-Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein: „Zigbee-Zustand“ zweimal (V5, V6). Die Zeilen des Status stehen in der Spalte „Parameter“ und werden von Hand eingetragen – in der angegebenen Reihenfolge, die Zeile ohne Bedingung zuletzt."
S1_SCHRITT6="Speichern und in den Miniserver übertragen. Probe: der Zähler zählt jede Minute weiter; „Zigbee-Zustand“ zeigt „läuft – Wohnzimmer …“. Im Plugin Reiter „Einstellungen“ „Anhalten“ drücken: nach etwa fünf Minuten nennt der Status „zigbee2mqtt schweigt“, nach weiteren fünf Minuten kommt „Meldung Zigbee gestört“. Danach „Starten“ drücken."
S1_H1="Zu #6 und #7: Die Meldung kommt erst nach fünf Minuten Störung – ein Neustart von zigbee2mqtt oder des LoxBerry meldet nicht."
S1_H2="Zu #3 und #9: Ein Batteriegerät gilt erst nach langer Stille als nicht erreichbar (Vorgabe von zigbee2mqtt); ein Gerät am Netz wie die Steckdose fällt schnell auf."
S1_H3="Zu #14 und #15: Der Status sagt in Klartext, was fehlt und welcher Knopf im Plugin hilft. Batterie 0 heißt „noch kein Wert“ – ein Eingang ohne Wert steht auf 0. Schwache Batterien meldet das Plugin selbst als LoxBerry-Benachrichtigung (Reiter „Einstellungen“, „Schwache Batterien melden“, Schwelle 15 %); in Loxone steht es nur im Status."
S1_NAMEN="Spalte 3 nennt die Namen aus dem Musterprojekt. Im eigenen Projekt stehen dort die eigenen Gerätenamen – so heißen erreichbar, Taster und Kontakt bei Ihnen (erstes passendes Gerät der Geräteliste, alle Namen in den Tabellen von Schritt 3 und 4):"
S2_ZWECK="Zigbee-Geräte in Loxone benutzen: ein Taster schaltet eine Zigbee-Steckdose um, dieselbe Steckdose folgt der Anwesenheit, ein Fensterkontakt meldet bei Abwesenheit, eine Zigbee-Lampe bekommt ihre Helligkeit aus der App. Die Seite hängt an den eigenen Geräten und an der Vorlage der Ausgänge (Schritt 4)."
S2_SCHRITT1="Die Geräte im Plugin anlernen: Reiter „Geräte“ → „Für 254 s öffnen“, Gerät in den Anlernmodus bringen. Den Namen in der Zigbee2mqtt UI oder in devices.yaml vergeben, BEVOR die Vorlagen erzeugt werden – die Namen stecken in allen Befehlen."
S2_SCHRITT2="Die drei Befehle (Nr. 4, 7, 18) am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ anlegen, Befehl genau wie in der Liste (nie retain). Ohne diesen Ausgang in Schritt 4 „Alle Ausgänge (virtueller Ausgang)“ drücken und einmal importieren (Peripherie → Virtuelle Ausgänge → Vordefinierte Geräte → Vorlage importieren)."
S2_SCHRITT3="Die Eingänge (Taster, Steckdose, Fensterkontakt) als Virtuelle Eingänge mit den Namen der Liste anlegen; unter Gateway V2 am Taster-Datenpunkt „Reset“ anhaken und bei Steckdose und Fenster die JSON-Felder (Schritt 2)."
S2_SCHRITT4="Zwei Virtuelle Eingänge anlegen (Peripherie → Virtuelle Eingänge): „Zigbee-Steckdose umschalten“ als Taste, „Zigbee-Lampe Helligkeit“ als Schieberegler (0 bis 254, Schritt 1), je „In Visualisierung verwenden“ an. Gibt es „Niemand zu Hause (eigene Quelle)“ (Schalter) noch nicht, ebenso anlegen. Benachrichtigung „Meldung Fenster offen“ anlegen (Peripherie → Mitteilungen → Benachrichtigung)."
S2_SCHRITT5="Neue Seite „Zigbee2MqttNG Geräte“. Die drei Befehle, die fünf Eingänge, die zwei neuen Eingänge und „Niemand zu Hause (eigene Quelle)“ auf die Seite ziehen. Im eigenen Projekt statt des Platzhalters die eigene Anwesenheit anschließen."
S2_SCHRITT6="Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen – ein ODER, ein UND, zwei NICHT, eine Einschaltverzögerung 120 s, ein Status – und nach der Spalte „Eingänge verbinden mit“ verbinden. Die Zeilen des Status „Zigbee-Steckdose“ stehen in der Spalte „Parameter“ und werden von Hand eingetragen, die Zeile ohne Bedingung zuletzt."
S2_SCHRITT7="Speichern und übertragen. Probe: Taster drücken – die Steckdose schaltet um, „Zigbee-Steckdose“ zeigt „an – … W“; noch einmal drücken – wieder aus. In der App „Niemand zu Hause“ einschalten – die Steckdose geht aus; Fenster öffnen – nach 2 Minuten kommt „Meldung Fenster offen“. Schieberegler auf 127 – die Lampe leuchtet halb."
S2_H1="Zu #1: Je Druck ein Impuls – das Gateway setzt den Wert danach auf 0. Doppelklick und langer Druck kommen genauso an (eigene Eingänge …_aktion_double, …_aktion_hold aus der Vorlage). Wer eine Lichtsteuerung nutzt, legt …_aktion_single an einen ihrer Eingänge."
S2_H2="Zu #4 und #8: Umschalten folgt dem echten Zustand der Dose (zigbee2mqtt schaltet mit TOGGLE um, auch nach einem Druck auf den Knopf an der Dose). Die Befehle gehen per UDP an das Gateway; unter hoher Last verwirft dessen Eingang Pakete. Ob ein Befehl gewirkt hat, zeigt die Rückmeldung #8, nicht der Schalter in der App."
S2_H3="Zu #8 und #12: Ohne die Umwandlung true/false/ON/OFF in 1/0 im MQTT-Gateway (Schritt 1) kommen state und contact als Text an und bleiben in Loxone 0. Wer die Haus-Themen eingeschaltet hat (Reiter MQTT), kann statt #12 und #13 haus_tuer_<name>_offen nehmen (1 = offen) und direkt an I1 von #14 legen."
S2_H4="Zu #17 und #18: Zigbee rechnet die Helligkeit 0–254, nicht in Prozent; 0 = aus. Der Befehl schickt den Wert ganzzahlig (<v.0>)."
S2_H5="Ein Befehl mit dem Namen eines anderen Geräts schaltet nichts – nach dem Umbenennen eines Geräts das Thema im Befehl anpassen. Wer keine Lampe hat, lässt Nr. 17 und 18 weg; wer die Steckdose nicht von der Anwesenheit schalten will, lässt Nr. 6 und 7 weg (Nr. 5 bleibt für die Fenstermeldung)."
