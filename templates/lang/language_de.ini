SperreGenerateRueckweg="Rückweg: zuerst unten „Sicherung herunterladen“ bzw. die Datei coordinator_backup.json aus dem Datenordner sichern. Die beschädigte Datei (.kaputt) und die Zweitschrift sieht sich dann der Hausherr bzw. der Support an und setzt die Netzwerte von Hand zurück. Kein Knopf schreibt das Netz zurück."
