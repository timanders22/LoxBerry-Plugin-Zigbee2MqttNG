[Backup]
Title="Sicherung"
Desc="Lädt eine Sicherung der zigbee2mqtt-Daten als ZIP herunter, von zigbee2mqtt selbst erstellt: Konfiguration, Gerätenamen und -optionen, die Gerätedatenbank und die Sicherung des Koordinators. Damit kann eine neue Installation oder ein neuer Koordinator desselben Typs das Netz übernehmen, ohne alle Geräte neu anzulernen."
Button="Sicherung herunterladen"
Secret="Die Sicherung enthält den Netzwerkschlüssel des Zigbee-Netzes und die MQTT-Zugangsdaten. Wie ein Kennwort aufbewahren."
Refused="zigbee2mqtt konnte die Sicherung nicht erstellen."
