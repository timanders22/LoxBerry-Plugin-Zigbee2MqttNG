WAS_IST_DAS="<b>Zigbee-Geräte für Loxone.</b> Zigbee2MqttNG betreibt <a href='https://www.zigbee2mqtt.io/' target='_blank'>zigbee2mqtt</a> als eigenen Dienst: zigbee2mqtt spricht über einen Koordinator (USB-Stick oder Netzwerkadapter) mit den Zigbee-Geräten und veröffentlicht jedes Gerät am MQTT-Broker, das MQTT-Gateway des LoxBerry leitet die Werte an den Miniserver weiter. Das Plugin ist auf das Zusammenspiel mit anderen Plugins ausgelegt, besonders mit Matter2Lox. Es ist ein eigenständiger Fork des Plugins Zigbee2Mqtt von romanlum (Apache-2.0) und kollidiert nicht mit dem Original; bis 4.0.0 hieß es Zigbee2Lox."

