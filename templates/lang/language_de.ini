Zu2="Zu #2: Die Analogwertvalidierung meldet am Ausgang error, wenn innerhalb von mintime kein neuer Wert kommt – das Lebenszeichen kommt jede Minute, 300 s überbrücken also vier verlorene Meldungen. Die Analogwertüberwachung passt hier nicht, sie wacht nur über einen Wertebereich. Loxone Config beschriftet die Anschlüsse V, En, Tmc, Min, Max und am Ausgang E (in der Projektdatei inval, mintime, minval, maxval, error). Den Zähler an V legen, nicht an En; an En eine Konstante 1 – in der Gegenprobe am 08.10.2026 prüfte der Baustein erst damit (unbeschaltet zeigte En Aus und V 0)."
Zu5="Zu #5: UND und ODER haben hier immer genau zwei Eingänge. Für jedes weitere Gerät kommt ein weiteres ODER dazu: I1 = das vorige ODER, I2 = das nächste NICHT."
Zu7="Zu #7: Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang legen – erst über ODER zusammenführen, sonst verschluckt eine dauerhaft aktive Quelle alle übrigen."
Zu10="Zu #10: Als 1/0 kommt der Kontakt nur an, wenn im MQTT-Gateway die Umwandlung true/false in 1/0 eingeschaltet ist (Schritt 1). Wer die Haus-Themen eingeschaltet hat, kann statt #10 und #11 haus_tuer_<name>_offen nehmen (1 = offen)."
Suche="Alle Bausteine findet Loxone Config über die Baustein-Suche (Taste F5)."
