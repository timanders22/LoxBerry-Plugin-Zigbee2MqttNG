KaputtJson="Eine lesbare Zweitschrift gibt es nicht. Entweder die Einstellungen in diesem Reiter vollständig eintragen und „Speichern und aktualisieren“ drücken – das ersetzt die Datei –, oder eine eigene Sicherung über „Einstellungen zurückspielen“ einspielen."
KaputtYaml="configuration.yaml trägt den Netzwerkschlüssel des Zigbee-Netzes. Deshalb wird zigbee2mqtt nicht gestartet, bis die Datei wieder lesbar ist: am besten die ZIP-Sicherung von zigbee2mqtt zurückspielen (Anleitung unten im Abschnitt Sicherung). Wer keine Sicherung hat und ein neues Netz in Kauf nimmt (alle Geräte neu anlernen), löscht die Datei per SSH; dann legt das Plugin sie beim nächsten Start ohne Netzwerkschlüssel neu an."
