Bestehend="Bestehende Anlagen: Vorlagen"
BestehendText="Die Vorlagen bleiben für Anlagen, die sie schon nutzen (virtueller HTTP-Eingang mit Befehlen, die das Gateway über den Titel beliefert, bzw. virtueller UDP-Eingang). Neu legt man einfache Virtuelle Eingänge nach der Namenstabelle an."
S4Nichts="Unter Gateway V1 und V2 ist für Befehle nichts einzutragen oder anzuhaken. Befehle nie retained senden: ein zurückbehaltenes /set würde zigbee2mqtt bei jedem Neustart erneut schalten."
S4Sicher="zigbee2mqtt nimmt Befehle von jedem an, der am MQTT-Broker schreiben darf, und über den UDP-Eingang des Gateways von jedem im Heimnetz. Das Plugin kann das nicht abschalten."
S3Alt="Die Tabelle je Gerät nennt für jeden Wert den Namen, unter dem das Gateway ihn per HTTP schickt, und die Befehlserkennung für den UDP-Weg. Die Knöpfe erzeugen daraus Vorlagen für Loxone Config: Baum links „Virtuelle Eingänge“, Menüband „Vordefinierte HTTP-Geräte“, „Vorlage Importieren…“."
