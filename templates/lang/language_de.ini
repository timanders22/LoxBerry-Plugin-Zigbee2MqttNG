S3Werte="Die Gerätewerte kommen unverändert von zigbee2mqtt. Fehlt ein Wert, kommt nichts – Loxone behält den letzten Wert bzw. 0 nach einem Neustart (kein -1 wie bei anderen Plugins; der Wert stammt nicht vom Plugin)."
