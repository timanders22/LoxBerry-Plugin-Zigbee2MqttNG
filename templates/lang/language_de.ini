Desc="Werte und Befehle für Loxone Config in sieben Schritten, erzeugt aus der Geräteliste von zigbee2mqtt. Der Weg führt immer über das MQTT-Gateway des LoxBerry. Namensschema ZIGBEE_<GERÄT>_<WERT> - passend zu MATTER_<N>_<E>_<THEMA> aus Matter2Lox."
