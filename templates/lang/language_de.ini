HintTemplates="Die HTTP-Vorlage legt Eingänge an, deren Titel genau der Name ist, unter dem das Gateway sendet; die Adresse http://localhost wird nie abgefragt (Abfragezeit eine Woche). Den Titel nicht ändern – sonst kommt dort kein Wert mehr an. Die UDP-Vorlage braucht den UDP-Port aus den Einstellungen des Gateways."
Name="Name"
