Zurueck2="Die ZIP-Datei auf den LoxBerry kopieren (zum Beispiel nach /tmp) und als Benutzer loxberry im Datenordner des Plugins auspacken; vorhandene Dateien werden überschrieben:"
Zurueck3="„Starten“ drücken und im Reiter Test prüfen, ob zigbee2mqtt online ist und die Geräte erreichbar sind."
ZurueckHinweis="Das Plugin packt die ZIP-Datei bewusst nicht selbst aus: ein Auspacken bei laufendem Dienst zerstört, was es retten soll. Unabhängig davon hält das Plugin Zweitschriften von mqtt.json, service.json, configuration.yaml und coordinator_backup.json neben seinem Konfigurationsordner (%s) und stellt eine unlesbare Datei daraus wieder her."

