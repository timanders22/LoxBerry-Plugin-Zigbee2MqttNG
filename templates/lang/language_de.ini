Zu2="Zu #2: Die Analogwertvalidierung meldet am Ausgang error, wenn innerhalb von mintime kein neuer Wert kommt – das Lebenszeichen kommt jede Minute, 300 s überbrücken also vier verlorene Meldungen. Die Analogwertüberwachung passt hier nicht, sie wacht nur über einen Wertebereich. Loxone Config beschriftet die Anschlüsse V, En, Tmc, Min, Max und am Ausgang E (in der Projektdatei inval, mintime, minval, maxval, error). Den Zähler an V legen, nicht an En; an En eine Konstante 1 (unbeschaltet steht En auf EIN)."
Zu5="Zu #5 und #9 bis #11: UND und ODER haben hier immer genau zwei Eingänge. Für jedes weitere Gerät kommen ein erreichbar-Eingang, ein NICHT und hinter #11 ein weiteres ODER dazu: I1 = das vorige ODER, I2 = das neue NICHT. Die Einschaltverzögerung #6 hängt immer am letzten ODER. Eine Zeile im Status #15 dazu, wenn der Klartext das Gerät nennen soll."
Zu7="Zu #7: Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang legen – erst über ODER zusammenführen, sonst verschluckt eine dauerhaft aktive Quelle alle übrigen."
Suche="Alle Bausteine findet Loxone Config über die Baustein-Suche (Taste F5)."
Zu2En="Zu #2: Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
