Output="Ausgang"
CmdOn="Befehl bei EIN / Wert"
CmdOff="Befehl bei AUS"
S1="Schritt 1: Weg"
S1Text="Zigbee2MqttNG hat keinen eigenen Endpunkt: zigbee2mqtt veröffentlicht jedes Gerät am MQTT-Broker, und das MQTT-Gateway des LoxBerry leitet die Werte an den Miniserver weiter. Befehle gehen den umgekehrten Weg über den UDP-Eingang des Gateways."
S1Http="Das Gateway sendet per HTTP: es setzt die virtuellen Eingänge des Miniservers über ihren Namen (das Thema mit _ statt /). Dafür ist die Vorlage „virtueller HTTP-Eingang“ in Schritt 3."
S1Udp="Das Gateway sendet per UDP an den eingetragenen Port. Dafür ist die Vorlage „virtueller UDP-Eingang“ in Schritt 3."
S2="Schritt 2: Abo im MQTT-Gateway"
S2V1="MQTT-Gateway Fassung 1: das Plugin trägt seine Themen selbst ein, wenn im Reiter MQTT „Topic beim MQTT Gateway registrieren“ eingeschaltet ist. Ohne diesen Eintrag kommt am Miniserver nichts an."
S2Ok="eingetragen, %d Abos"
S2Fehlt="kein Abo für dieses Plugin eingetragen – im Reiter MQTT „Topic beim MQTT Gateway registrieren“ einschalten und speichern."
S2V2="MQTT-Gateway Fassung 2: hier ist nichts einzutragen; die Datenpunkte unter MQTT Gateway, Abonnements anhaken."
S2EigenerBroker="Das Plugin benutzt einen eigenen MQTT-Broker (Reiter MQTT). Das MQTT-Gateway des LoxBerry sieht diese Werte nur, wenn es mit demselben Broker verbunden ist."
S3="Schritt 3: Virtuelle Eingänge anlegen"
S3Text="Die Tabelle je Gerät nennt für jeden Wert den Namen, unter dem das Gateway ihn per HTTP schickt, und die Befehlserkennung für den UDP-Weg. Die Knöpfe erzeugen daraus Vorlagen für Loxone Config: Baum links „Virtuelle Eingänge“, Menüband „Vordefinierte HTTP-Geräte“, „Vorlage Importieren…“."
Pflichtsatz="Loxone Config legt beim Import neu an und überschreibt nichts – zweimal eingelesen ergibt doppelte Eingänge."
AllInputsHttp="Alle Eingänge (virtueller HTTP-Eingang, Weg HTTP)"
InputsHttp="Eingänge (HTTP)"
TextWerte="%d Werte kommen als Text an (Aufzählungen, LOCK/UNLOCK) und stehen nicht in den Vorlagen."
EinzelOderAlle="Entweder die Vorlage aller Geräte oder die der einzelnen Geräte einlesen, nicht beides: von zwei Eingängen mit demselben Namen bekommt nur einer den Wert."
Kachel="Name in der App (Kachel)"
S4="Schritt 4: Befehle senden"
S4Text="Ein virtueller Ausgang schickt JSON-Befehle an den UDP-Eingang des Gateways – so funktionieren auch Gerätenamen mit Leerzeichen. Importweg: Baum links „Virtuelle Ausgänge“, Menüband „Vordefinierte Geräte“, „Vorlage Importieren…“. Adresse:"
S5="Schritt 5: Ausfallerkennung"
S5Text="Virtuelle Eingänge behalten ihren letzten Wert. Stirbt zigbee2mqtt, bleiben alle Gerätewerte und auch …/erreichbar stehen (erreichbar wird nur bei Ereignissen gesendet und ist nicht retained) – in der App sieht alles normal aus. Deshalb sendet die Erweiterung des Plugins jede Minute ein Lebenszeichen, das nie retained ist: die Zeit in Unix-Sekunden und einen Zähler 0…999. Bleibt der Zähler stehen, schweigt zigbee2mqtt. Die Vorlage aller Eingänge in Schritt 3 enthält beide."
Bedeutung="Bedeutung"
Nie="nie"
KachelTs="Lebenszeichen Zeit"
KachelZaehler="Lebenszeichen Zähler"
S6="Schritt 6: Zwei komplette Baustein-Listen zum 1:1-Nachbauen"
S6Text="Zwei Seiten aus dem LoxBerry-Plugins Musterprojekt, jede Zeile ein Baustein. Die erste („Zigbee2MqttNG“) überwacht zigbee2mqtt und zwei Geräte und genügt für den Anfang; die zweite („Zigbee2MqttNG Geräte“) benutzt Zigbee-Geräte in beide Richtungen – Taster, Steckdose, Fensterkontakt, Lampe. Keine Leitung geht über die Seitengrenze."
S7="Schritt 7: Gegenprobe"
S7a="Reiter Test: die Zeile „Kommt das Lebenszeichen für Loxone?“ ist grün."
S7b="Im MQTT-Gateway unter „Eingehende Daten“ erscheint %s einmal in der Minute, jedes Mal um eins größer."
S7c="In Loxone Config zählt im Monitor des Eingangs #1 der Wert minütlich weiter."
S7d="Im Reiter Einstellungen „Anhalten“ drücken: nach etwa fünf Minuten meldet #2 die Störung. Danach „Starten“ drücken."
VorlageHttp="Zigbee2MqttNG über das MQTT-Gateway (HTTP). Die Werte schickt das Gateway, diese Adresse wird nie abgefragt. Titel nicht ändern - der Titel ist der Name, unter dem das Gateway sendet. Loxone Config legt beim Import neu an und überschreibt nichts. %d Textwerte sind nicht enthalten."
VorlageUdp="Zigbee2MqttNG über das MQTT-Gateway (UDP). Loxone Config legt beim Import neu an und überschreibt nichts. %d Textwerte sind nicht enthalten."
VorlageOut="Zigbee2MqttNG: Befehle an den UDP-Eingang des MQTT-Gateways. Loxone Config legt beim Import neu an und überschreibt nichts."
BILD_ALT="Bausteine des Plugins in Loxone Config"
BILD_UNTERSCHRIFT="Seite „Zigbee2MqttNG“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."
MUSTERPROJEKT="Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen:"
S7e="Taster drücken: die Rückmeldung …_state der Steckdose wechselt (Seite „Zigbee2MqttNG Geräte“, #8)."
BILD2_UNTERSCHRIFT="Seite „Zigbee2MqttNG Geräte“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."

