[Backup]
Title="Sicherung"
Desc="Lädt eine Sicherung der zigbee2mqtt-Daten als ZIP herunter, von zigbee2mqtt selbst erstellt: Konfiguration, Gerätenamen und -optionen, die Gerätedatenbank und die Sicherung des Koordinators. Damit kann eine neue Installation oder ein neuer Koordinator desselben Typs das Netz übernehmen, ohne alle Geräte neu anzulernen."
Button="Sicherung herunterladen"
Secret="Die Sicherung enthält den Netzwerkschlüssel des Zigbee-Netzes und die MQTT-Zugangsdaten. Wie ein Kennwort aufbewahren."
Refused="zigbee2mqtt konnte die Sicherung nicht erstellen."
NetzTitel="Zigbee-Netz (Sicherung von zigbee2mqtt)"
ZurueckTitel="Zurückspielen der ZIP-Sicherung, von Hand per SSH:"
Zurueck1="Oben unter „Dienst zigbee2mqtt“ auf „Anhalten“ drücken."
Zurueck2="Die ZIP-Datei auf den LoxBerry kopieren (zum Beispiel nach /tmp) und als Benutzer loxberry im Datenordner des Plugins auspacken; vorhandene Dateien werden überschrieben:"
Zurueck3="„Starten“ drücken und im Reiter Test prüfen, ob zigbee2mqtt online ist und die Geräte erreichbar sind."
ZurueckHinweis="Das Plugin packt die ZIP-Datei bewusst nicht selbst aus: ein Auspacken bei laufendem Dienst zerstört, was es retten soll. Unabhängig davon hält das Plugin Zweitschriften von mqtt.json, service.json, configuration.yaml und coordinator_backup.json neben seinem Konfigurationsordner (%s) und stellt eine unlesbare Datei daraus wieder her."

