S1="Step 1: Route"
S1Text="Zigbee2MqttNG has no endpoint of its own: zigbee2mqtt publishes every device on the MQTT broker, and the MQTT gateway of the LoxBerry forwards the values to the Miniserver. Commands take the opposite route through the UDP input of the gateway."
S1Http="The gateway sends via HTTP: it sets the virtual inputs of the Miniserver by their name (the topic with _ instead of / and spaces). The names are listed in step 3."
S1Udp="The gateway sends via UDP to the configured port. The template “virtual UDP input” under “Existing installations” in step 3 is meant for this."
S2="Step 2: Subscription in the MQTT gateway"
S2V1="MQTT gateway version 1: the plugin registers its topics itself when “Register topic at the MQTT gateway” is switched on in the MQTT tab. Without this entry nothing arrives at the Miniserver."
S2Ok="registered, %d subscriptions"
S2Fehlt="no subscription registered for this plugin – switch on “Register topic at the MQTT gateway” in the MQTT tab and save."
S2V2="MQTT gateway version 2: there is nothing to enter here. Tick these data points under MQTT Gateway → Subscriptions. For devices with several values switch on “JSON” at the subscription and tick the fields one by one (“Forward” for each field):"
S2EigenerBroker="The plugin uses an own MQTT broker (MQTT tab). The MQTT gateway of the LoxBerry only sees these values if it is connected to the same broker."
S3="Step 3: Create virtual inputs"
S3Text="For every value Loxone needs, create a Virtual Input (Periphery → Virtual Inputs) with exactly the title in the column Name – the copy button helps; for texts a Virtual Text Input. Do not tick “Use as digital input”. The LoxBerry user on the Miniserver needs rights on the inputs. Whoever copies the sample project pages gets the inputs with them. Device renamed in zigbee2mqtt or base topic changed: all names new."
Pflichtsatz="Loxone Config creates new objects on import and overwrites nothing – importing twice gives duplicate inputs."
AllInputsHttp="All inputs (virtual HTTP input, HTTP route)"
InputsHttp="Inputs (HTTP)"
TextWerte="%d values arrive as text (enumerations, LOCK/UNLOCK) and are not in the templates."
EinzelOderAlle="Import either the template of all devices or those of single devices, not both: of two inputs with the same name only one gets the value."
Kachel="Name in the app (tile)"
S4="Step 4: Send commands"
S4Text="A virtual output sends the commands to the UDP input of the MQTT gateway, like the other plugins: publish zigbee2mqtt/<device>/set/<property> <value>. Only for device names with spaces the template uses the JSON form. Whoever copies the sample project pages uses the shared output “LoxBerry MQTT-Gateway”. Import path of the template: tree on the left “Virtual Outputs”, ribbon “Predefined devices”, “Import template…”. Address:"
S5="Step 5: Failure detection"
S5Text="Virtual inputs keep their last value. If zigbee2mqtt dies, all device values and also …/erreichbar stay where they are (erreichbar is only sent on events and is not retained) – everything looks normal in the app. That is why the extension of the plugin sends a sign of life every minute that is never retained: the time in Unix seconds and a counter 0…999. If the counter stops, zigbee2mqtt has gone silent. The names are in the table below and in step 3."
Bedeutung="Meaning"
Nie="never"
KachelTs="heartbeat time"
KachelZaehler="heartbeat counter"
S6="Step 6: Two complete block lists to rebuild 1:1"
S6Text="Two pages from the LoxBerry-Plugins sample project, every row one block. The first (“Zigbee2MqttNG”) watches zigbee2mqtt and two devices and is enough for a start; the second (“Zigbee2MqttNG Geräte”) uses Zigbee devices in both directions – button, plug, window contact, lamp. No connection crosses the page border."
S7="Step 7: Cross-check"
S7a="Test tab: the line “Does the heartbeat for Loxone come?” is green."
S7b="In the MQTT gateway under “Incoming data”, %s appears once a minute, each time one higher."
S7c="In Loxone Config the monitor of input #1 counts up every minute."
S7d="Press “Stop” on the Settings tab: after about five minutes #2 reports the fault. Then press “Start”."
