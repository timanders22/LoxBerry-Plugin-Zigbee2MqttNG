SCHRITTE_TITEL="How to take over this page"
S1_TITEL="Zigbee2MqttNG"
S2_TITEL="Zigbee2MqttNG Geräte"
S1_ZWECK="Is zigbee2mqtt running, are the devices there? Everybody needs this page: it reports when zigbee2mqtt is silent or a device is not reachable, and shows the state in plain words. It is enough for a start."
S1_SCHRITT1="In the plugin, tab “Settings”: “Report availability” on (on by default). Tab “Test”: the line “Does the heartbeat for Loxone come?” is green. In the MQTT gateway switch on the conversion of true/false/ON/OFF to 1/0 (step 1 on this tab shows whether it is on)."
S1_SCHRITT2="In Loxone Config under Periphery → Virtual Inputs create one Virtual Input per value of the list (no. 1, 3, 9, 12, 13, 14), title exactly as in the column Name – in your own project with your own device names from the name table in step 3. Under gateway V2 tick the data points first (step 2, temperature, humidity and battery as JSON fields)."
S1_SCHRITT3="Create the page “Zigbee2MqttNG”. Drag the counter (…_zigbee2mqttng_zaehler), erreichbar of two devices as well as temperature, humidity and battery of a sensor, plus the constant 1. In your own project your own device names stand there."
S1_SCHRITT4="Create the notification “Meldung Zigbee gestört” (Periphery → Messages → Notification), text as in the list, and drag it onto the page. It gets exactly one connection (from no. 6)."
S1_SCHRITT5="Place the remaining blocks via the block search (key F5), parameters as in the list, and wire them from top to bottom according to the column “Connect inputs to”. Value Validator no. 2: En = constant 1, and remove the tick at ‚En‘ in the properties (Config creates En inverted; with the tick the 1 arrives as 0 and the notification never triggers). Status inputs from V5 only appear after clicking the “+” on the block: “Zigbee-Zustand” twice (V5, V6). The rows of the status are in the column “Parameters” and are entered by hand – in the given order, the row without condition last."
S1_SCHRITT6="Save and transfer to the Miniserver. Test: the counter goes up every minute; “Zigbee-Zustand” shows “läuft – Wohnzimmer …”. In the plugin, tab “Settings”, press “Stop”: after about five minutes the status says “zigbee2mqtt schweigt”, after another five minutes “Meldung Zigbee gestört” arrives. Then press “Start”."
S1_H1="On #6 and #7: the notification only comes after five minutes of fault – a restart of zigbee2mqtt or of the LoxBerry does not report."
S1_H2="On #3 and #9: a battery device only counts as not reachable after a long silence (default of zigbee2mqtt); a device on the mains like the plug is noticed quickly."
S1_H3="On #14 and #15: the status says in plain words what is missing and which button in the plugin helps. Battery 0 means “no value yet” – an input without a value stands at 0. The plugin itself reports low batteries as a LoxBerry notification (tab “Settings”, “Report low batteries”, threshold 15 %); in Loxone it only shows in the status."
S1_NAMEN="Column 3 names the sample project names. In your own project your own device names stand there – this is what erreichbar, button and contact are called on your system (first matching device of the device list, all names in the tables of steps 3 and 4):"
S2_ZWECK="Using Zigbee devices in Loxone: a button toggles a Zigbee plug, the same plug follows the presence, a window contact reports while nobody is home, a Zigbee lamp gets its brightness from the app. The page depends on your own devices and on the template of the outputs (step 4)."
S2_SCHRITT1="Pair the devices in the plugin: tab “Devices” → “Open for 254 s”, put the device into pairing mode. Give the name in the Zigbee2mqtt UI or in devices.yaml BEFORE the templates are created – the names are part of every command."
S2_SCHRITT2="Create the three commands (no. 4, 7, 18) at the shared output “LoxBerry MQTT-Gateway”, command exactly as in the list (never retain). Without that output press “All outputs (virtual output)” in step 4 and import it once (Periphery → Virtual Outputs → Predefined devices → Import template)."
S2_SCHRITT3="Create the inputs (button, socket, window contact) as Virtual Inputs with the names of the list; under gateway V2 tick “Reset” at the button data point and the JSON fields for socket and window (step 2)."
S2_SCHRITT4="Create two virtual inputs (Periphery → Virtual Inputs): “Zigbee-Steckdose umschalten” as push button, “Zigbee-Lampe Helligkeit” as slider (0 to 254, step 1), each with “Use in User Interface” on. If “Niemand zu Hause (eigene Quelle)” (switch) does not exist yet, create it as well. Create the notification “Meldung Fenster offen” (Periphery → Messages → Notification)."
S2_SCHRITT5="New page “Zigbee2MqttNG Geräte”. Drag the three commands, the five inputs, the two new inputs and “Niemand zu Hause (eigene Quelle)” onto the page. In your own project connect your own presence instead of the placeholder."
S2_SCHRITT6="Place the remaining blocks via the block search (key F5) – one OR, one AND, two NOT, one Switch-On Delay 120 s, one Status – and wire them according to the column “Connect inputs to”. The rows of the status “Zigbee-Steckdose” are in the column “Parameters” and are entered by hand, the row without condition last."
S2_SCHRITT7="Save and transfer. Test: press the button – the plug toggles, “Zigbee-Steckdose” shows “an – … W”; press again – off again. Switch on “Niemand zu Hause” in the app – the plug goes off; open the window – after 2 minutes “Meldung Fenster offen” arrives. Slider to 127 – the lamp shines at half brightness."
S2_H1="On #1: one pulse per press – the gateway then resets the value to 0. Double click and long press arrive the same way (own inputs …_aktion_double, …_aktion_hold from the template). Whoever uses a lighting controller connects …_aktion_single to one of its inputs."
S2_H2="On #4 and #8: toggling follows the real state of the socket (zigbee2mqtt toggles with TOGGLE, also after a press on the button of the socket). The commands go to the gateway via UDP; under high load its input drops packets. Whether a command worked is shown by the feedback #8, not by the switch in the app."
S2_H3="On #8 and #12: without the conversion of true/false/ON/OFF to 1/0 in the MQTT gateway (step 1), state and contact arrive as text and stay 0 in Loxone. With the house topics switched on (tab MQTT), haus_tuer_<name>_offen (1 = open) can replace #12 and #13 and go directly to I1 of #14."
S2_H4="On #17 and #18: Zigbee counts the brightness 0–254, not in percent; 0 = off. The command sends the value as a whole number (<v.0>)."
S2_H5="A command with the name of another device switches nothing – after renaming a device adjust the topic in the command. Whoever has no lamp leaves out no. 17 and 18; whoever does not want the socket to follow presence leaves out no. 6 and 7 (no. 5 stays for the window message)."
T_VE="Virtual input (name as the MQTT gateway assigns it, plugin Zigbee2MqttNG)"
T_VA="Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT)"

