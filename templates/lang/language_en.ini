S1="Step 1: Route"
S1Text="Zigbee2MqttNG has no endpoint of its own: zigbee2mqtt publishes every device on the MQTT broker, and the MQTT gateway of the LoxBerry forwards the values to the Miniserver. Commands take the opposite route through the UDP input of the gateway."
