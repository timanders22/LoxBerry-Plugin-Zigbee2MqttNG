ZIEL_SPRACHE_HINWEIS="Language: for Music Server and address template two lower-case letters as in ISO 639-1, e.g. en, de, fr, it, es, nl; for Sonos (SonoX) also with country, e.g. en-gb, de-at; empty = as target 1. The module only checks the form. Amazon Echo, Google speakers and Sonos (Sonos4Lox) speak in the language of the device – the field is locked there; an entry (after changing the kind) is discarded on saving."
K_ZIEL_SPRACHE_GERAET="Target %s: %s speaks in the language of the device – the language field does not apply here, the entry was discarded."
