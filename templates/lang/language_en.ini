WAS_IST_DAS="<b>Zigbee devices for Loxone.</b> Zigbee2MqttNG runs <a href='https://www.zigbee2mqtt.io/' target='_blank'>zigbee2mqtt</a> as its own service: zigbee2mqtt talks to the Zigbee devices through a coordinator (USB stick or network adapter) and publishes every device on the MQTT broker; the MQTT gateway of the LoxBerry forwards the values to the Miniserver. The plugin is made to work together with other plugins, in particular Matter2Lox. It is an independent fork of the Zigbee2Mqtt plugin by romanlum (Apache-2.0) and does not collide with the original; up to 4.0.0 it was called Zigbee2Lox."
