MUSTERPROJEKT="The complete project file with all plugin pages and templates:"
S7e="Press the button: the feedback …_state of the plug changes (page “Zigbee2MqttNG Geräte”, #8)."
BILD2_UNTERSCHRIFT="Page “Zigbee2MqttNG Geräte” in the LoxBerry-Plugins sample project. Config shortens long block names – names see table."
S2Reset="For buttons (…/aktion/…) tick “Reset” at the data point – otherwise the input stays at the counter value and only the first press works. Under version 1 the file mqtt_resetaftersend.cfg of the plugin takes care of this."
