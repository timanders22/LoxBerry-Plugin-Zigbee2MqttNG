Zu2="On #2: the analog value validation sets its output error when no new value arrives within mintime – the heartbeat comes every minute, so 300 s bridge four lost messages. The analog watchdog does not fit here, it only watches a range of values. Loxone Config labels the connectors V, En, Tmc, Min, Max and the output E (in the project file inval, mintime, minval, maxval, error). Connect the counter to V, not to En; connect a constant 1 to En (unconnected, En is ON)."
Zu5="On #5 and #9 to #11: AND and OR always have exactly two inputs here. Each further device gets an erreichbar input, a NOT and one more OR behind #11: I1 = the previous OR, I2 = the new NOT. The Switch-On Delay #6 always hangs on the last OR. Add a row to the status #15 if the plain text should name the device."
Zu7="On #7: the notification block only sends on a change from off to on. Never connect several sources directly to its input – join them with OR first, otherwise one permanently active source swallows all others."
Suche="Loxone Config finds all blocks through the block search (key F5)."
Zu2En="On #2: Config creates input En inverted (tick at ‚En‘ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
