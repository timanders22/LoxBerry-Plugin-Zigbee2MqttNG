S3="Step 3: Create virtual inputs"
S3Text="The table of each device names, for every value, the name the gateway sends it under via HTTP and the command recognition for the UDP route. The buttons build templates for Loxone Config from it: tree on the left “Virtual Inputs”, ribbon “Predefined HTTP devices”, “Import template…”."
Pflichtsatz="Loxone Config creates new objects on import and overwrites nothing – importing twice gives duplicate inputs."
