VorlageUdp="Zigbee2MqttNG via the MQTT gateway (UDP). Loxone Config creates new objects on import and overwrites nothing. %d text values are not included."
VorlageOut="Zigbee2MqttNG: commands to the UDP input of the MQTT gateway. Loxone Config creates new objects on import and overwrites nothing."
