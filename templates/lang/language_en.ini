Kachel="Name in the app (tile)"
S4="Step 4: Send commands"
S4Text="A virtual output sends JSON commands to the UDP input of the gateway – so device names with spaces work as well. Import: tree on the left “Virtual Outputs”, ribbon “Predefined devices”, “Import template…”. Address:"
S5="Step 5: Failure detection"
S5Text="Virtual inputs keep their last value. If zigbee2mqtt dies, all device values and …/erreichbar stay as they are (erreichbar is only sent on events and is not retained) – in the app everything looks normal. That is why the extension of the plugin sends a heartbeat every minute that is never retained: the time in unix seconds and a counter 0…999. If the counter stops, zigbee2mqtt is silent. The template of all inputs in step 3 contains both."
