[Backup]
Title="Backup"
Desc="Downloads a backup of the zigbee2mqtt data as zip, made by zigbee2mqtt itself: configuration, device names and options, the device database and the coordinator backup. With it, a new installation or a new coordinator of the same type can take over the network without pairing all devices again."
Button="Download backup"
Secret="The backup contains the network key of the Zigbee network and the MQTT credentials. Keep it like a password."
Refused="zigbee2mqtt could not create the backup."
NetzTitel="Zigbee network (backup made by zigbee2mqtt)"
ZurueckTitel="Restoring the zip backup, by hand via SSH:"
Zurueck1="Press “Stop” under “zigbee2mqtt service” above."
Zurueck2="Copy the zip file to the LoxBerry (for example to /tmp) and unpack it as user loxberry in the data folder of the plugin; existing files are overwritten:"
Zurueck3="Press “Start” and check on the Test tab that zigbee2mqtt is online and the devices are reachable."
ZurueckHinweis="The plugin deliberately does not unpack the zip file itself: unpacking while the service runs destroys what it should rescue. Apart from that, the plugin keeps second copies of mqtt.json, service.json, configuration.yaml and coordinator_backup.json next to its config folder (%s) and restores an unreadable file from them."

