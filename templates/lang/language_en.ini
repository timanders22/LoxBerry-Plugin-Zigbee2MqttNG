E12="I1 = #11"
Zu2="On #2: the analog value validation sets its output error when no new value arrives within mintime – the heartbeat comes every minute, so 300 s bridge four lost messages. The analog watchdog does not fit here, it only watches a range of values. Loxone Config labels the connectors V, En, Tmc, Min, Max and the output E (in the project file inval, mintime, minval, maxval, error). Connect the counter to V, not to En; connect a constant 1 to En – in the check on 08.10.2026 the block only validated with it (unconnected, En showed off and V 0)."
Zu5="On #5: AND and OR always have exactly two inputs here. Each further device gets one more OR: I1 = the previous OR, I2 = the next NOT."
Zu7="On #7: the notification block only sends on a change from off to on. Never connect several sources directly to its input – join them with OR first, otherwise one permanently active source swallows all others."
Zu10="On #10: the contact only arrives as 1/0 when the conversion of true/false to 1/0 is switched on in the MQTT gateway (step 1). With the house topics switched on, haus_tuer_<name>_offen (1 = open) can replace #10 and #11."
Suche="Loxone Config finds all blocks through the block search (key F5)."

