on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 4.0.0)"
        required: true
      notes:
        description: "Release notes (markdown)"
        required: false
        default: ""

name: publish release (manual)

# Builds plugin.zip, points release.cfg/prerelease.cfg to the new version and
# publishes the GitHub release in one go. A release created with GITHUB_TOKEN
# does not trigger release.yml/prerelease.yml, so everything happens here.
# Commits and tags are made by an anonymous bot identity.

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Invalid version $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then echo "Tag $VERSION exists"; exit 1; fi
      - name: Update release.cfg and prerelease.cfg
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp resources/release.cfg release.cfg
          cp resources/prerelease.cfg prerelease.cfg
          sed -i "s/__VERSION__/$VERSION/g" release.cfg prerelease.cfg
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add release.cfg prerelease.cfg
          git commit -m "Release version $VERSION"
          git tag -a "$VERSION" -m "Zigbee2MqttNG $VERSION"
          git push origin master "$VERSION"
      - name: Install php dependencies
        uses: php-actions/composer@v6
        with:
          php_version: 7.4
          dev: no
          args: --profile -o
          working_dir: "webfrontend/htmlauth/include"
      - name: Build plugin.zip
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/__VERSION__/$VERSION/g" plugin.cfg
          mkdir -p /tmp/plugin
          # 4.1.1 (B16): Dockerfile-php-build is left by the composer action,
          # .gitignore and resources/ (templates of release.cfg) are not
          # needed on the LoxBerry
          rsync -a --exclude .git --exclude .github --exclude output.log --exclude DOCKER_ENV --exclude docker_tag \
            --exclude Dockerfile-php-build --exclude .gitignore --exclude resources ./ /tmp/plugin/
          # 4.1.1 (B18): only bin/ may be executable (the installer sets the
          # hooks executable itself); vendor/ of composer stays as it is
          chmod 0644 /tmp/plugin/postroot.sh /tmp/plugin/version.sh
          AUSF=$(find /tmp/plugin -type f -perm /111 ! -path '/tmp/plugin/bin/*' ! -path '*/include/vendor/*')
          if [ -n "$AUSF" ]; then echo "Executable outside bin/: $AUSF"; exit 1; fi
          (cd /tmp/plugin && zip -qr /tmp/plugin.zip .)
          unzip -p /tmp/plugin.zip plugin.cfg | grep "^VERSION=$VERSION$"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > /tmp/notes.md
          gh release create "$VERSION" /tmp/plugin.zip --title "Zigbee2MqttNG $VERSION" --notes-file /tmp/notes.md --latest
